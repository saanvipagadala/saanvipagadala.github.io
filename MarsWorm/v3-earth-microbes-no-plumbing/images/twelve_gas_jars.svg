<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d"><title id="t">Experiment 3: twelve jars under three gases</title><desc id="d">Four groups of three jars, all sealed under a mix of hydrogen, nitrogen, carbon dioxide and a little oxygen. A bar under each group shows how far it grew. Standard medium grows furthest, regolith reaches about a third of it, regolith with fertiliser a little further, and the jars with no bacterium do not grow.</desc><rect x="0" y="0" width="760" height="300" fill="#fdfcfb"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs><text x="380.0" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Twelve jars, five weeks, nothing to eat but gas</text><text x="380.0" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">hydrogen, nitrogen, carbon dioxide and a little oxygen, sealed in with the dirt</text><rect x="40" y="52" width="680" height="18" rx="9" fill="#f7f3f1" stroke="#e2ddd9" stroke-width="1.2"/><text x="380" y="65" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the same gas mix to every jar</text><rect x="40" y="82" width="160" height="170" rx="7" fill="#f7f3f1" stroke="#b3401f" stroke-width="1.8"/><text x="120" y="102" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">Jar A</text><rect x="68" y="108" width="28" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="70" y="113" width="24" height="34" 