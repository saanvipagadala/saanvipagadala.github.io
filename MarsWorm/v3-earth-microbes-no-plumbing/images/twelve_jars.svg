<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d"><title id="t">Experiment 1: twelve jars</title><desc id="d">Four groups of three jars, each drawn with the perchlorate left in it after four weeks. Jar A holds damp Martian simulant, perchlorate, Azospira and hydrogen, and most of its perchlorate is gone. Jar B has no bacterium and is still full. Jar C is water instead of dirt and is the emptiest. Jar D has no hydrogen and is still full.</desc><rect x="0" y="0" width="760" height="300" fill="#fdfcfb"/><text x="380.0" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Twelve jars. One tests the design, three take the credit away</text><text x="380.0" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">each jar drawn with the perchlorate left in it after four weeks</text><rect x="40" y="56" width="160" height="196" rx="7" fill="#f7f3f1" stroke="#b3401f" stroke-width="1.8"/><text x="120" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">Jar A</text><rect x="62" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="64" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="65.4" y="144.8" width="25.2" height="17.2" rx="2" fill="#b08d3e"/><rect x="102" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="104" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="105.4" y="144.8" width="25.2" height="17.2" rx="2" fill="#b08d3e"/><rect x="142" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="144" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="145.4" y="144.8" width="25.2" height="17.2" rx="2" fill="#b08d3e"/><path d="M 60 178 L 180 178" stroke="#e2ddd9" stroke-width="1.2"/><text x="120" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">dirt, bacterium,</text><text x="120" y="209" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">hydrogen</text><text x="120" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="italic">the design</text><rect x="222" y="56" width="160" height="196" rx="7" fill="#f7f3f1" stroke="#e2ddd9" stroke-width="1.4"/><text x="302" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">Jar B</text><rect x="244" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="246" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="247.4" y="96.0" width="25.2" height="66.0" rx="2" fill="#b08d3e"/><rect x="284" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="286" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="287.4" y="96.0" width="25.2" height="66.0" rx="2" fill="#b08d3e"/><rect x="324" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="326" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="327.4" y="96.0" width="25.2" height="66.0" rx="2" fill="#b08d3e"/><path d="M 242 178 L 362 178" stroke="#e2ddd9" stroke-width="1.2"/><text x="302" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">dirt,</text><text x="302" y="209" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">no bacterium</text><text x="302" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="italic">does the dirt do it alone?</text><rect x="404" y="56" width="160" height="196" rx="7" fill="#f7f3f1" stroke="#e2ddd9" stroke-width="1.4"/><text x="484" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">Jar C</text><rect x="426" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="428" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="429.4" y="151.4" width="25.2" height="10.6" rx="2" fill="#b08d3e"/><rect x="466" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="468" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="469.4" y="151.4" width="25.2" height="10.6" rx="2" fill="#b08d3e"/><rect x="506" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="508" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="509.4" y="151.4" width="25.2" height="10.6" rx="2" fill="#b08d3e"/><path d="M 424 178 L 544 178" stroke="#e2ddd9" stroke-width="1.2"/><text x="484" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">water, bacterium,</text><text x="484" y="209" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">hydrogen</text><text x="484" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="italic">can it do it at all?</text><rect x="586" y="56" width="160" height="196" rx="7" fill="#f7f3f1" stroke="#e2ddd9" stroke-width="1.4"/><text x="666" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">Jar D</text><rect x="608" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="610" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="611.4" y="98.0" width="25.2" height="64.0" rx="2" fill="#b08d3e"/><rect x="648" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="650" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="651.4" y="98.0" width="25.2" height="64.0" rx="2" fill="#b08d3e"/><rect x="688" y="88" width="32" height="5" rx="2" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><rect x="690" y="92" width="28" height="74" rx="4" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="691.4" y="98.0" width="25.2" height="64.0" rx="2" fill="#b08d3e"/><path d="M 606 178 L 726 178" stroke="#e2ddd9" stroke-width="1.2"/><text x="666" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">dirt, bacterium,</text><text x="666" y="209" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">no hydrogen</text><text x="666" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="italic">is hydrogen what pays?</text><rect x="40" y="268" width="14" height="10" rx="2" fill="#b08d3e"/><text x="60" y="277" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">perchlorate still in the jar</text><text x="250" y="277" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">An empty jar is a clean one. What is left in it instead is chloride, and stage 2 deals with that.</text></svg>