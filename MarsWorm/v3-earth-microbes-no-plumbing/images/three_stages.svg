<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" role="img" aria-labelledby="t d"><title id="t">Three stages, one bed of dirt</title><desc id="d">One bed of Martian dirt inside a habitat, drawn three times, once for each stage. In stage one a bacterium strips the perchlorate and the dirt stops being poisonous. In stage two two more bacteria build it up with carbon, nitrogen and phosphorus, and the chlorine left behind leaves as a gas through a vent. In stage three earthworms turn it into soil. The only thing piped in is hydrogen, and nothing is pumped from bed to bed: the same dirt stays where it is from beginning to end.</desc><rect x="0" y="0" width="760" height="366" fill="#fdfcfb"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401f"/></marker></defs><text x="380.0" y="22" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Three stages, one bed of dirt, and no plumbing at all</text><path d="M 16 292 L 16 150 A 96 96 0 0 1 112 54 L 648 54 A 96 96 0 0 1 744 150 L 744 292 Z" fill="#f7f3f1" stroke="#e2ddd9" stroke-width="1.4"/><text x="380.0" y="74" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">inside the habitat: the same bed of dirt, start to finish</text><rect x="48" y="96" width="196" height="150" rx="7" fill="#fdfcfb" stroke="#b3401f" stroke-width="1.6"/><circle cx="68" cy="118" r="10" fill="#b3401f"/><text x="68" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">1</text><text x="86" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Clean it</text><rect x="70" y="140" width="152" height="46" rx="5" fill="#f7f3f1" stroke="#6b6b6b" stroke-width="1.2"/><circle cx="82" cy="152" r="3" fill="#b3401f" opacity="0.75"/><circle cx="103" cy="163" r="3" fill="#b3401f" opacity="0.75"/><circle cx="124" cy="174" r="3" fill="#b3401f" opacity="0.75"/><circle cx="145" cy="152" r="3" fill="#b3401f" opacity="0.75"/><circle cx="166" cy="163" r="3" fill="#b3401f" opacity="0.75"/><circle cx="187" cy="174" r="3" fill="#b3401f" opacity="0.75"/><circle cx="208" cy="152" r="3" fill="#b3401f" opacity="0.75"/><text x="146" y="204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Azospira strips the</text><text x="146" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">perchlorate off</text><text x="146" y="236" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#b3401f" text-anchor="middle" font-weight="normal" font-style="italic">the dirt is no longer poison</text><path d="M 248 170 L 276 170" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="262" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">wait</text><rect x="280" y="96" width="196" height="150" rx="7" fill="#fdfcfb" stroke="#b08d3e" stroke-width="1.6"/><circle cx="300" cy="118" r="10" fill="#b08d3e"/><text x="300" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">2</text><text x="318" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Enrich it</text><rect x="302" y="140" width="152" height="46" rx="5" fill="#f7f3f1" stroke="#6b6b6b" stroke-width="1.2"/><path d="M 316 176 q 5 -8 10 0 t 10 0" fill="none" stroke="#b08d3e" stroke-width="2" stroke-linecap="round"/><path d="M 340 176 q 5 -8 10 0 t 10 0" fill="none" stroke="#b08d3e" stroke-width="2" stroke-linecap="round"/><path d="M 364 176 q 5 -8 10 0 t 10 0" fill="none" stroke="#b08d3e" stroke-width="2" stroke-linecap="round"/><path d="M 388 176 q 5 -8 10 0 t 10 0" fill="none" stroke="#b08d3e" stroke-width="2" stroke-linecap="round"/><path d="M 412 176 q 5 -8 10 0 t 10 0" fill="none" stroke="#b08d3e" stroke-width="2" stroke-linecap="round"/><path d="M 436 176 q 5 -8 10 0 t 10 0" fill="none" stroke="#b08d3e" stroke-width="2" stroke-linecap="round"/><text x="378" y="204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Xanthobacter and Bacillus</text><text x="378" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">add carbon, nitrogen, phosphorus</text><text x="378" y="236" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#b08d3e" text-anchor="middle" font-weight="normal" font-style="italic">the chlorine leaves as a gas</text><path d="M 480 170 L 508 170" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="494" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">wait</text><rect x="512" y="96" width="196" height="150" rx="7" fill="#fdfcfb" stroke="#3f7d5c" stroke-width="1.6"/><circle cx="532" cy="118" r="10" fill="#3f7d5c"/><text x="532" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">3</text><text x="550" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Worm it</text><rect x="534" y="140" width="152" height="46" rx="5" fill="#f7f3f1" stroke="#6b6b6b" stroke-width="1.2"/><path d="M 548 170 q 8 -10 16 0 t 16 0" fill="none" stroke="#3f7d5c" stroke-width="2.4" stroke-linecap="round"/><path d="M 582 170 q 8 -10 16 0 t 16 0" fill="none" stroke="#3f7d5c" stroke-width="2.4" stroke-linecap="round"/><path d="M 616 170 q 8 -10 16 0 t 16 0" fill="none" stroke="#3f7d5c" stroke-width="2.4" stroke-linecap="round"/><path d="M 650 170 q 8 -10 16 0 t 16 0" fill="none" stroke="#3f7d5c" stroke-width="2.4" stroke-linecap="round"/><text x="610" y="204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Earthworms eat their</text><text x="610" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">way through it</text><text x="610" y="236" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#3f7d5c" text-anchor="middle" font-weight="normal" font-style="italic">what comes out is soil</text><path d="M 120 292 L 120 250" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="120" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">hydrogen, the only thing sent in</text><text x="120" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">made by putting electricity through water</text><path d="M 400 138 L 400 92" stroke="#b3401f" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="400" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">chlorine, out as a gas</text><text x="380.0" y="348" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">No wash tank, no rock bin, no lit tank, no membranes, and nothing pumped from one place to another.</text></svg>