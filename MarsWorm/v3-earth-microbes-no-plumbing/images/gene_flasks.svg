<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d"><title id="t">Experiment 4: the flask with the gene, and the flask without</title><desc id="d">Two sealed flasks side by side. In the first the bacterium carries a gene borrowed from a salt marsh plant: chloride in the liquid becomes methyl chloride, which collects in the headspace above it, and the chloride level falls. In the second the same bacterium has no gene, no gas appears, and the chloride stays where it is.</desc><rect x="0" y="0" width="760" height="320" fill="#fdfcfb"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs><text x="380.0" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">The only genuinely new thing in the design, and its control</text><text x="380.0" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">chloride cannot be washed away, so it has to leave as a gas</text><rect x="40" y="58" width="330" height="214" rx="8" fill="#f7f3f1" stroke="#b3401f" stroke-width="1.8"/><text x="205" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">Flask A: with the gene</text><path d="M 100 96 L 100 150 L 70 236 L 230 236 L 200 150 L 200 96 Z" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.4"/><rect x="94" y="90" width="112" height="7" rx="3" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><path d="M 84 200 L 216 200 L 230 236 L 70 236 Z" fill="#e2ddd9" opacity="0.9"/><text x="150" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">chloride in the water</text><circle cx="126" cy="128" r="4" fill="none" stroke="#b3401f" stroke-width="1.4"/><circle cx="146" cy="116" r="5.5" fill="none" stroke="#b3401f" stroke-width="1.4"/><circle cx="168" cy="132" r="4.5" fill="none" stroke="#b3401f" stroke-width="1.4"/><circle cx="154" cy="144" r="3.5" fill="none" stroke="#b3401f" stroke-width="1.4"/><circle cx="182" cy="120" r="3" fill="none" stroke="#b3401f" stroke-width="1.4"/><text x="150" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">methyl chloride, a gas</text><path d="M 240 150 L 340 150" stroke="#b3401f" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="290" y="142" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">measured in the</text><text x="290" y="164" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">sealed headspace</text><text x="205" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">the chloride falls, and the gas accounts for it</text><rect x="390" y="58" width="330" height="214" rx="8" fill="#f7f3f1" stroke="#e2ddd9" stroke-width="1.4"/><text x="555" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">Flask B: the same bacterium, no gene</text><path d="M 450 96 L 450 150 L 420 236 L 580 236 L 550 150 L 550 96 Z" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.4"/><rect x="444" y="90" width="112" height="7" rx="3" fill="#e2ddd9" stroke="#6b6b6b" stroke-width="1"/><path d="M 434 190 L 566 190 L 580 236 L 420 236 Z" fill="#e2ddd9" opacity="0.9"/><text x="500" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">chloride in the water</text><text x="500" y="128" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="italic">nothing collects</text><text x="555" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">anything here is not the gene's doing</text><text x="40" y="296" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">Growth is measured in both. A gene that works but halves the growth is a different answer from one that works.</text></svg>