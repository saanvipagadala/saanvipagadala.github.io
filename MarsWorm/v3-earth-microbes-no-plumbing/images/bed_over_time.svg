<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d"><title id="t">One bed of dirt, read stage by stage</title><desc id="d">Three columns, one for each stage, read left to right. For every stage the diagram gives what goes in, what the dirt is made of, and what leaves. Stage one: Azospira and hydrogen go in, the perchlorate in the dirt is replaced by chloride, nothing leaves. Stage two: Xanthobacter, Bacillus and hydrogen go in, the chloride is replaced by carbon and nitrogen, and chlorine leaves as a gas. Stage three: worms go in, the dirt is soil, and nothing leaves. The same dirt stays in the same box throughout.</desc><rect x="0" y="0" width="760" height="430" fill="#fdfcfb"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3401f"/></marker></defs><text x="380.0" y="26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">One bed of dirt, read from left to right</text><text x="380.0" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the same dirt, in the same box, at three different times</text><rect x="40" y="60" width="220" height="26" rx="6" fill="#b3401f"/><text x="150.0" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">Stage 1.  Clean it</text><rect x="280" y="60" width="220" height="26" rx="6" fill="#b08d3e"/><text x="390.0" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">Stage 2.  Enrich it</text><rect x="520" y="60" width="200" height="26" rx="6" fill="#3f7d5c"/><text x="620.0" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">Stage 3.  Worm it</text><text x="40" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">What goes in</text><rect x="40.0" y="124" width="106.0" height="20" rx="10" fill="#fdfcfb" stroke="#b3401f" stroke-width="1.3"/><text x="93.0" y="138" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">Azospira</text><rect x="154.0" y="124" width="106.0" height="20" rx="10" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.3"/><text x="207.0" y="138" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">hydrogen</text><rect x="280.0" y="124" width="136.0" height="20" rx="10" fill="#fdfcfb" stroke="#b08d3e" stroke-width="1.3"/><text x="348.0" y="138.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#b08d3e" text-anchor="middle" font-weight="bold" font-style="normal">Xanthobacter and Bacillus</text><rect x="424.0" y="124" width="76.0" height="20" rx="10" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.3"/><text x="462.0" y="138.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">hydrogen</text><rect x="520.0" y="124" width="200.0" height="20" rx="10" fill="#fdfcfb" stroke="#3f7d5c" stroke-width="1.3"/><text x="620.0" y="138" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#3f7d5c" text-anchor="middle" font-weight="bold" font-style="normal">compost worms</text><text x="40" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">What the dirt is made of</text><rect x="40" y="188" width="220" height="112" rx="6" fill="#f7f3f1" stroke="#6b6b6b" stroke-width="1.3"/><rect x="44" y="192.0" width="212" height="28.2" rx="4" fill="#b3401f" opacity="0.9"/><text x="150.0" y="209.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">perchlorate</text><rect x="44" y="223.2" width="212" height="13.6" rx="4" fill="#b08d3e" opacity="0.9"/><text x="150.0" y="233.51999999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">chloride</text><rect x="44" y="239.8" width="212" height="53.2" rx="4" fill="#e2ddd9" opacity="1"/><text x="150.0" y="269.91999999999996" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">rock and water</text><rect x="280" y="188" width="220" height="112" rx="6" fill="#f7f3f1" stroke="#6b6b6b" stroke-width="1.3"/><rect x="284" y="192.0" width="212" height="7.4" rx="4" fill="#b08d3e" opacity="0.9"/><text x="390.0" y="199.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">chloride</text><rect x="284" y="202.4" width="212" height="28.2" rx="4" fill="#3f7d5c" opacity="0.9"/><text x="390.0" y="220.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">carbon and nitrogen</text><rect x="284" y="233.6" width="212" height="59.4" rx="4" fill="#e2ddd9" opacity="1"/><text x="390.0" y="266.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">rock and water</text><rect x="520" y="188" width="200" height="112" rx="6" fill="#f7f3f1" stroke="#6b6b6b" stroke-width="1.3"/><rect x="524" y="192.0" width="192" height="40.7" rx="4" fill="#3f7d5c" opacity="0.9"/><text x="620.0" y="215.84" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">carbon and nitrogen</text><rect x="524" y="235.7" width="192" height="57.3" rx="4" fill="#e2ddd9" opacity="1"/><text x="620.0" y="267.84000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">rock and water</text><path d="M 242 244.0 L 274 244.0" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="258" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the poison is gone</text><path d="M 482 244.0 L 514 244.0" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="498" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the chlorine is gone</text><text x="40" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">What leaves</text><rect x="40" y="342" width="220" height="26" rx="6" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.4"/><text x="150.0" y="359" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">nothing</text><rect x="280" y="342" width="220" height="26" rx="6" fill="#fdfcfb" stroke="#b3401f" stroke-width="1.4"/><path d="M 308 364 L 308 346" stroke="#b3401f" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="400.0" y="359" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">chlorine, as a gas</text><rect x="520" y="342" width="200" height="26" rx="6" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.4"/><text x="620.0" y="359" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">nothing</text><text x="380.0" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Nothing is pumped, nothing is washed, and no tank is ever emptied.</text><text x="380.0" y="414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">At the end the box holds soil, and a scoop of it starts the next bed.</text></svg>