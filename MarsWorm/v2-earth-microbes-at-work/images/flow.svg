<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
<title id="t">How MarsWorm works</title>
<desc id="d">A flow diagram in three lanes. The dust lane: Mars dust is washed, then worked on by Bacillus megaterium in a rock bin to free its phosphorus, then goes to a growing bed with worms, and soil comes out. The water lane: the wash water carries the poison to a dark tank where Azospira destroys it, then clean water returns to the wash and to the bed, and brine is poured outside. The food lane: Rhodobacter in a lit tank makes sour acids for the dark tank and bacteria for the bed, fed by hydrogen, lamps and Mars air.</desc>
<rect x="0.0" y="0.0" width="760.0" height="470.0" rx="0" fill="#fdfcfb" stroke="none" stroke-width="1"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs><text x="380.0" y="24.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Mars dust in one end, soil out the other</text><rect x="0.0" y="56.0" width="760.0" height="104.0" rx="0" fill="#f0ecea" stroke="none" stroke-width="1"/><text x="14.0" y="72.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">THE DUST</text><rect x="0.0" y="186.0" width="760.0" height="104.0" rx="0" fill="#f0ecea" stroke="none" stroke-width="1"/><text x="14.0" y="202.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">THE WATER</text><rect x="0.0" y="316.0" width="760.0" height="136.0" rx="0" fill="#f0ecea" stroke="none" stroke-width="1"/><text x="14.0" y="332.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">THE FOOD</text><rect x="40.0" y="78.0" width="160.0" height="62.0" rx="7" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.4"/><text x="120.0" y="100.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1  Wash</text><text x="120.0" y="117.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">two or three soaks</text><text x="120.0" y="130.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the poison dissolves</text><rect x="300.0" y="78.0" width="160.0" height="62.0" rx="7" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.4"/><text x="380.0" y="100.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">2  Rock bin</text><text x="380.0" y="117.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a3317" text-anchor="middle" font-weight="bold" font-style="italic">Bacillus megaterium</text><text x="380.0" y="130.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">frees phosphorus and iron</text><rect x="560.0" y="78.0" width="160.0" height="62.0" rx="7" fill="#fdfcfb" stroke="#b3401f" stroke-width="1.4"/><text x="640.0" y="100.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">5  Growing bed</text><text x="640.0" y="117.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a3317" text-anchor="middle" font-weight="bold" font-style="italic">earthworms</text><text x="640.0" y="130.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">this is the soil</text><path d="M 200 109 L 298 109" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="249.0" y="101.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">washed dust</text><path d="M 460 109 L 558 109" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="509.0" y="101.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">three weeks on</text><path d="M 700 140 L 700 172" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="700.0" y="182.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#b3401f" text-anchor="middle" font-weight="bold" font-style="normal">soil</text><rect x="300.0" y="208.0" width="160.0" height="62.0" rx="7" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.4"/><text x="380.0" y="230.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">4  Dark tank</text><text x="380.0" y="247.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a3317" text-anchor="middle" font-weight="bold" font-style="italic">Azospira suillum</text><text x="380.0" y="260.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">eats the poison</text><path d="M 140 140 L 140 239 L 298 239" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="219.0" y="231.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">poisoned water</text><path d="M 380 208 L 380 160 L 80 160 L 80 142" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="230.0" y="152.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">clean water, round again</text><path d="M 460 239 L 600 239 L 600 142" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="530.0" y="231.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">clean water</text><path d="M 430 208 L 430 176" stroke="#b3401f" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="470.0" y="170.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#b3401f" text-anchor="middle" font-weight="normal" font-style="normal">brine, poured outside</text><rect x="300.0" y="338.0" width="160.0" height="62.0" rx="7" fill="#fdfcfb" stroke="#b08d3e" stroke-width="1.4"/><text x="380.0" y="360.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">3  Lit tank</text><text x="380.0" y="377.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a3317" text-anchor="middle" font-weight="bold" font-style="italic">Rhodobacter</text><text x="380.0" y="390.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">fixes nitrogen, makes food</text><path d="M 380 338 L 380 272" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="412.0" y="310.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">sour acids</text><path d="M 460 369 L 640 369 L 640 142" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="550.0" y="361.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">bacteria, carrying the nitrogen</text><path d="M 340 430 L 340 402" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="340.0" y="446.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">hydrogen</text><path d="M 420 430 L 420 402" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="420.0" y="446.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">lamps  ·  Mars air</text><path d="M 250 262 L 298 262" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="248.0" y="276.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">hydrogen</text><text x="746.0" y="462.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-style="normal">Nothing here is genetically modified. Every organism can be ordered today.</text>
</svg>
