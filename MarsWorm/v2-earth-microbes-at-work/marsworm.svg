<!-- "The goal" from the Stage 1 map (the_map.html): the microbe that can do
     all 23 jobs, drawn at the corner of the chart no real organism reaches.

     The viewBox is the map's own, from MICROBE_SVG. Do not tighten it by eye:
     the body ellipse has ry="10" and the flagellum curves out to x=25, so a
     smaller box clips the creature.

     NOTE: no double hyphen anywhere in this comment. A double hyphen is
     illegal inside an XML comment and makes the whole file fail to parse,
     which shows up as a logo that has silently vanished. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -19 46 30" width="230" height="150">
  <ellipse rx="12.5" ry="10" fill="#f0b429"/>
  <path d="M 12 3 C 18 6 20 -1 25 1" fill="none" stroke="#f0b429" stroke-width="2" stroke-linecap="round"/>
  <path d="M -9 -7 L -14 -12" stroke="#f0b429" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M -2 -10 L -4 -16" stroke="#f0b429" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="-3.5" cy="-1.5" r="1.7" fill="#0e1016"/>
  <circle cx="3.5" cy="-1.5" r="1.7" fill="#0e1016"/>
</svg>
