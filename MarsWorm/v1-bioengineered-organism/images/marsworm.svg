<!-- The MarsWorm mark from the Stage 1 map (the_map.html), where it is drawn
     on the chart at the corner no real organism reaches. Same shapes, same
     violet, and the map's own viewBox from MARSWORM_SVG. Companion to
     goal.svg.

     NOTE: no double hyphen anywhere in this comment. A double hyphen is
     illegal inside an XML comment and makes the whole file fail to parse,
     which shows up as a logo that has silently vanished. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -19 40 32" width="200" height="160">
  <ellipse cx="-13" cy="5" rx="5.5" ry="4.5" fill="#9085e9" opacity="0.6"/>
  <ellipse cx="-6" cy="3" rx="6.5" ry="5.5" fill="#9085e9" opacity="0.78"/>
  <ellipse cx="2" cy="0" rx="7.5" ry="6.5" fill="#9085e9" opacity="0.9"/>
  <circle cx="11" cy="-3" r="7.5" fill="#9085e9"/>
  <path d="M 8 -9 L 6 -15" stroke="#9085e9" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 14 -9 L 16 -15" stroke="#9085e9" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="6" cy="-16" r="1.6" fill="#9085e9"/>
  <circle cx="16" cy="-16" r="1.6" fill="#9085e9"/>
  <circle cx="9" cy="-4" r="1.7" fill="#0e1016"/>
  <circle cx="14.5" cy="-4" r="1.7" fill="#0e1016"/>
</svg>
