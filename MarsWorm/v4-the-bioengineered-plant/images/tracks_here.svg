<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="t d">
<title id="t">Three tracks</title>
<desc id="d">A large rounded box labelled Martian habitat, a dome buried under regolith, holds Track A, chemistry and ordinary organisms with no genes added, and Track B, one organism that replaces the hardware, many genes. Outside the box, on open Mars, sits Track C, the wild organism, many genes. Arrows run A to B to C, and a dashed line carries what A learns back to both. Track C is ringed and flagged where version 4 is heading.</desc>
