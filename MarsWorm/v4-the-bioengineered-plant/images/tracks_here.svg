"#b3401f" stroke-width="1.6"/><text x="54.0" y="106.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3401f" text-anchor="start" font-weight="bold" font-style="normal">Track A</text><text x="54.0" y="124.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Earth microbes, unmodified</text><rect x="56.0" y="144.0" width="24.0" height="30.0" rx="3" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="57.2" y="153.0" width="21.6" height="19.8" rx="2" fill="#e2ddd9" stroke="none" stroke-width="1"/><text x="68.0" y="186.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">wash</text><path d="M 82 159 L 94 159" stroke="#6b6b6b" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><rect x="96.0" y="144.0" width="22.0" height="30.0" rx="3" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="97.2" y="156.0" width="19.6" height="16.8" rx="2" fill="#b08d3e" stroke="none" stroke-width="1"/><rect x="122.0" y="144.0" width="22.0" height="30.0" rx="3" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="123.2" y="156.0" width="19.6" height="16.8" rx="2" fill="#6b6b6b" stroke="none" stroke-width="1"/><text x="120.0" y="186.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">two tanks</text><path d="M 146 159 L 158 159" stroke="#6b6b6b" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="154.0" width="60.0" height="20.0" rx="4" fill="#f0ecea" stroke="#6b6b6b" stroke-width="1.2"/><path d="M 168 166 q 5 -6 10 0 t 10 0 t 10 0" fill="none" stroke="#b3401f" stroke-width="2.2" stroke-linecap="round"/><path d="M 188 162 q 5 -6 10 0 t 10 0 t 10 0" fill="none" stroke="#b08d3e" stroke-width="2.2" stroke-linecap="round"/><text x="190.0" y="186.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">worms</text><text x="54.0" y="230.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="italic">bacteria and worms, as nature made them</text><rect x="54.0" y="238.0" width="65.0" height="17.0" rx="8.5" fill="#b3401f" stroke="none" stroke-width="1"/><text x="86.5" y="250.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">not GMO</text><rect x="290.0" y="84.0" width="196.0" height="180.0" rx="7" fill="#fdfcfb" stroke="#b08d3e" stroke-width="1.6"/><text x="304.0" y="106.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b08d3e" text-anchor="start" font-weight="bold" font-style="normal">Track B</text><text x="304.0" y="124.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">One GMO microbe, in the dome</text><ellipse cx="388" cy="160" rx="70" ry="22" fill="#f0ecea" stroke="#b08d3e" stroke-width="1.6"/><rect x="348.0" y="148.0" width="14.0" height="22.0" rx="3" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="349.2" y="156.8" width="11.6" height="12.0" rx="2" fill="#b08d3e" stroke="none" stroke-width="1"/><path d="M 366 160 L 374 160" stroke="#6b6b6b" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><rect x="376.0" y="148.0" width="14.0" height="22.0" rx="3" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.2"/><rect x="377.2" y="156.8" width="11.6" height="12.0" rx="2" fill="#6b6b6b" stroke="none" stroke-width="1"/><path d="M 394 160 L 402 160" stroke="#6b6b6b" stroke-width="1.2" fill="none" marker-end="url(#ah)"/><path d="M 404 162 q 5 -6 10 0 t 10 0 t 10 0" fill="none" stroke="#b3401f" stroke-width="2.2" stroke-linecap="round"/><text x="388.0" y="196.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the tanks, inside one cell</text><text x="304.0" y="230.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="italic">the hardware's jobs, moved into genes</text><rect x="304.0" y="238.0" width="37.0" height="17.0" rx="8.5" fill="#b08d3e" stroke="none" stroke-width="1"/><text x="322.5" y="250.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">GMO</text><rect x="538.0" y="84.0" width="196.0" height="180.0" rx="7" fill="#fdfcfb" stroke="#b3401f" stroke-width="1.6"/><text x="552.0" y="106.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3401f" text-anchor="start" font-weight="bold" font-style="normal">Track C</text><text x="552.0" y="124.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">One GMO organism, outside</text><path d="M 578 140 l -4 8 l 8 6 l -4 8" fill="none" stroke="#b3401f" stroke-width="1.2" stroke-linecap="round"/><path d="M 608 140 l -4 8 l 8 6 l -4 8" fill="none" stroke="#b3401f" stroke-width="1.2" stroke-linecap="round"/><path d="M 638 140 l -4 8 l 8 6 l -4 8" fill="none" stroke="#b3401f" stroke-width="1.2" stroke-linecap="round"/><path d="M 668 140 l -4 8 l 8 6 l -4 8" fill="none" stroke="#b3401f" stroke-width="1.2" stroke-linecap="round"/><path d="M 698 140 l -4 8 l 8 6 l -4 8" fill="none" stroke="#b3401f" stroke-width="1.2" stroke-linecap="round"/><path d="M 552 180 q 20 -6 40 0 t 40 0 t 40 0 t 40 0" fill="none" stroke="#6b6b6b" stroke-width="1.4"/><ellipse cx="636" cy="174" rx="16" ry="8" fill="#fdfcfb" stroke="#6b6b6b" stroke-width="1.6"/><text x="636.0" y="196.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">alone on the surface</text><text x="552.0" y="230.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="italic">survives outside, with no help</text><rect x="552.0" y="238.0" width="37.0" height="17.0" rx="8.5" fill="#b3401f" stroke="none" stroke-width="1"/><text x="570.5" y="250.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">GMO</text><rect x="532.0" y="78.0" width="208.0" height="192.0" rx="11" fill="none" stroke="#b3401f" stroke-width="2.4"/><rect x="546.4" y="58.0" width="179.2" height="17.0" rx="8.5" fill="#b3401f" stroke="none" stroke-width="1"/><text x="636.0" y="70.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#fdfcfb" text-anchor="middle" font-weight="bold" font-style="normal">where version 4 is heading</text><path d="M 636 75 L 636 78" stroke="#b3401f" stroke-width="2.4"/><path d="M 238 174 L 288 174" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="263.0" y="156.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">hardware</text><text x="263.0" y="167.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">eaten</text><path d="M 486 174 L 536 174" stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="511.0" y="156.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">taken</text><text x="511.0" y="167.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">outdoors</text><path d="M 138 266 L 138 310 L 636 310 L 636 268" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M 388 310 L 388 268" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="388.0" y="328.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">what A learns on the bench is what B and C are built from</text>
