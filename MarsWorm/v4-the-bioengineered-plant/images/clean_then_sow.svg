<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
<title id="t">Two weeks of cleaning, then the seed goes in</title>
<desc id="d">A timeline running from day zero to day forty two. The first fortnight is shaded and labelled no plants yet, because the bacterium is given the pot to itself and works in the dark. Across that fortnight the chlorate in pots A and C falls away to almost nothing, while the chlorate in pots B and D, which have no bacterium, stays where it started. A dashed line marks the sowing on day fourteen, after the fall. So the radish in the cleaned pots never meets the chlorate and grows healthy, and the radish in the untouched pots meets all of it and stays sick.</desc>
<rect x="0.0" y="0.0" width="800.0" height="440.0" rx="0" fill="#fdfcfb" stroke="none" stroke-width="1"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs><text x="400.0" y="26.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Two weeks of cleaning, then the seed goes in</text><text x="400.0" y="44.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">The radish never meets the chlorate. That is the whole experiment.</text><rect x="96.0" y="84.0" width="168.0" height="208.0" rx="0" fill="#f4efe9" stroke="none" stroke-width="1"/><text x="180.0" y="98.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">NO PLANTS YET</text><text x="180.0" y="111.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the bacterium works in the dark</text><line x1="96.0" y1="292.0" x2="620.0" y2="292.0" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="96.0" y1="292.0" x2="96.0" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="96.0" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">day 0</text><line x1="264.0" y1="292.0" x2="264.0" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="264.0" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">day 14</text><line x1="432.0" y1="292.0" x2="432.0" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="432.0" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">day 28</text><line x1="600.0" y1="292.0" x2="600.0" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="600.0" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">day 42</text><text x="348.0" y="332.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a4a" text-anchor="middle" font-weight="italic" font-style="normal">six weeks in all</text><text x="84.0" y="98.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="end" font-weight="bold" font-style="normal">chlorate</text><text x="84.0" y="111.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-style="normal">in the pot</text><line x1="264.0" y1="84.0" x2="264.0" y2="300.0" stroke="#b3401f" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="264.0" cy="70" r="7" fill="#b3401f"/><text x="277.0" y="74.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#b3401f" text-anchor="start" font-weight="bold" font-style="normal">SOW</text><polyline points="96.0,122.0 108.0,140.0 120.0,154.5 132.0,167.9 144.0,180.6 156.0,192.9 168.0,204.7 180.0,216.3 192.0,227.6 204.0,238.8 216.0,249.7 228.0,260.5 240.0,271.1 252.0,281.6 264.0,285.2 276.0,285.2 312.0,285.2 348.0,285.2 384.0,285.2 420.0,285.2 456.0,285.2 492.0,285.2 528.0,285.2 564.0,285.2 600.0,285.2" fill="none" stroke="#b3401f" stroke-width="2.6"/><polyline points="96.0,122.0 600.0,127.1" fill="none" stroke="#6b6b6b" stroke-width="2.6"/><text x="612.0" y="131.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">pots B and D</text><text x="612.0" y="144.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">no bacterium</text><text x="612.0" y="267.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#b3401f" text-anchor="start" font-weight="bold" font-style="normal">pots A and C</text><text x="612.0" y="280.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#b3401f" text-anchor="start" font-weight="normal" font-style="normal">bacterium added</text><path d="M 492.0 364 Q 488.256 355.36 482.64 349.6" stroke="#4a6b3e" fill="none" stroke-width="1.728" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="482.64" cy="349.6" rx="4.68" ry="3.024" fill="#4a6b3e" transform="rotate(-25 482.64 349.6)"/><path d="M 492.0 364 Q 495.744 355.792 501.36 350.32" stroke="#4a6b3e" fill="none" stroke-width="1.728" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="501.36" cy="350.32" rx="4.68" ry="3.024" fill="#4a6b3e" transform="rotate(25 501.36 350.32)"/><path d="M 492.0 364 Q 490.272 352.336 487.68 344.56" stroke="#4a6b3e" fill="none" stroke-width="1.728" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="487.68" cy="344.56" rx="4.68" ry="3.024" fill="#4a6b3e" transform="rotate(-25 487.68 344.56)"/><path d="M 492.0 364 Q 493.728 352.76800000000003 496.32 345.28" stroke="#4a6b3e" fill="none" stroke-width="1.728" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="496.32" cy="345.28" rx="4.68" ry="3.024" fill="#4a6b3e" transform="rotate(25 496.32 345.28)"/><path d="M 492.0 364 Q 492.0 351.04 492.0 342.4" stroke="#4a6b3e" fill="none" stroke-width="1.728" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="492.0" cy="342.4" rx="4.68" ry="3.024" fill="#4a6b3e" transform="rotate(25 492.0 342.4)"/><ellipse cx="492.0" cy="373.36" rx="7.92" ry="9.36" fill="#b3401f"/><path d="M 492.0 382.0 q 1.44 7.199999999999999 -0.72 12.24" stroke="#b3401f" fill="none" stroke-width="1.152" stroke-linecap="round" stroke-linejoin="round"/><path d="M 488.976 379.84 q -5.04 5.76 -8.064 9.36" stroke="#b3401f" fill="none" stroke-width="0.792" stroke-linecap="round" stroke-linejoin="round"/><path d="M 495.024 379.84 q 5.04 5.76 8.064 9.36" stroke="#b3401f" fill="none" stroke-width="0.792" stroke-linecap="round" stroke-linejoin="round"/><text x="492.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">clean dirt, healthy radish</text><path d="M 228.0 364 Q 225.624 361.48 220.08 358.96" stroke="#b8a94e" fill="none" stroke-width="1.584" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220.08" cy="358.96" rx="3.312" ry="1.8719999999999999" fill="#b8a94e" transform="rotate(-40 220.08 358.96)"/><path d="M 228.0 364 Q 230.376 361.84 235.92 359.68" stroke="#b8a94e" fill="none" stroke-width="1.584" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="235.92" cy="359.68" rx="3.312" ry="1.8719999999999999" fill="#b8a94e" transform="rotate(40 235.92 359.68)"/><path d="M 228.0 364 Q 228.0 360.04 228.0 356.08" stroke="#b8a94e" fill="none" stroke-width="1.584" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="228.0" cy="356.08" rx="3.312" ry="1.8719999999999999" fill="#b8a94e" transform="rotate(40 228.0 356.08)"/><ellipse cx="228.0" cy="368.32" rx="3.168" ry="3.5999999999999996" fill="#c9a98f"/><text x="228.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">chlorate still there, sick radish</text>
