<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 415.08" width="780" height="415.08" role="img" aria-labelledby="t d">
<title id="t">One plant, three jobs, inside the habitat</title>
<desc id="d">A radish growing in a pot of raw Martian dirt, drawn inside a domed habitat that stands on the Martian ground. The dome is labelled warm, lit and pressurised. Three numbered notes point at the plant's roots. Job one stops the self-poisoning, because the plant turns Martian chlorate into chlorite by mistake and the chlorite wrecks its own nitrogen enzyme, so one borrowed enzyme splits the chlorite into harmless salt and oxygen. Job two unlocks the rock, because phosphorus and iron are locked inside it, so the root pushes out acid to dissolve them free. Job three stores the salt that splitting the chlorite creates, inside storage sacs in the plant's own cells. The plant is given nothing but water and light.</desc>
