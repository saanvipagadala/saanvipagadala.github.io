c3af"/><circle cx="263.7" cy="320.8" r="1.5" fill="#d9c3af"/><circle cx="257.1" cy="312.2" r="1.5" fill="#d9c3af"/><circle cx="143.5" cy="283.3" r="1.5" fill="#d9c3af"/><circle cx="168.3" cy="219.8" r="1.5" fill="#d9c3af"/><text x="102.0" y="344.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">RAW MARTIAN DIRT</text><line x1="92.0" y1="206.0" x2="300.0" y2="206.0" stroke="#d9c3af" stroke-width="2"/><path d="M 196.0 206 Q 186.12 183.2 171.3 168.0" stroke="#4a6b3e" fill="none" stroke-width="4.56" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="171.3" cy="168.0" rx="12.35" ry="7.9799999999999995" fill="#4a6b3e" transform="rotate(-25 171.3 168.0)"/><path d="M 196.0 206 Q 205.88 184.34 220.7 169.9" stroke="#4a6b3e" fill="none" stroke-width="4.56" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220.7" cy="169.9" rx="12.35" ry="7.9799999999999995" fill="#4a6b3e" transform="rotate(25 220.7 169.9)"/><path d="M 196.0 206 Q 191.44 175.22 184.6 154.7" stroke="#4a6b3e" fill="none" stroke-width="4.56" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="184.6" cy="154.7" rx="12.35" ry="7.9799999999999995" fill="#4a6b3e" transform="rotate(-25 184.6 154.7)"/><path d="M 196.0 206 Q 200.56 176.36 207.4 156.6" stroke="#4a6b3e" fill="none" stroke-width="4.56" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="207.4" cy="156.6" rx="12.35" ry="7.9799999999999995" fill="#4a6b3e" transform="rotate(25 207.4 156.6)"/><path d="M 196.0 206 Q 196.0 171.8 196.0 149.0" stroke="#4a6b3e" fill="none" stroke-width="4.56" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="196.0" cy="149.0" rx="12.35" ry="7.9799999999999995" fill="#4a6b3e" transform="rotate(25 196.0 149.0)"/><ellipse cx="196.0" cy="230.7" rx="20.9" ry="24.7" fill="#b3401f"/><path d="M 196.0 253.5 q 3.8 19.0 -1.9 32.3" stroke="#b3401f" fill="none" stroke-width="3.04" stroke-linecap="round" stroke-linejoin="round"/><path d="M 188.02 247.8 q -13.299999999999999 15.2 -21.28 24.7" stroke="#b3401f" fill="none" stroke-width="2.09" stroke-linecap="round" stroke-linejoin="round"/><path d="M 203.98 247.8 q 13.299999999999999 15.2 21.28 24.7" stroke="#b3401f" fill="none" stroke-width="2.09" stroke-linecap="round" stroke-linejoin="round"/><rect x="0.0" y="356.0" width="360.0" height="9.0" rx="0" fill="#d9c3af" stroke="none" stroke-width="1"/><line x1="0.0" y1="356.0" x2="360.0" y2="356.0" stroke="#6b6b6b" stroke-width="1.6"/><rect x="372.0" y="96.0" width="382.0" height="89.5" rx="8" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.3"/><circle cx="398" cy="116" r="11" fill="#b3401f"/><text x="398.0" y="120.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text><text x="416.0" y="120.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Stop the self-poisoning</text><text x="387.0" y="140.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">The plant turns Martian chlorate into chlorite by mistake, and the</text><text x="387.0" y="153.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">chlorite wrecks its own nitrogen enzyme. One borrowed enzyme splits</text><text x="387.0" y="167.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">the chlorite into harmless salt and oxygen.</text><line x1="276.0" y1="240.0" x2="364.0" y2="140.8" stroke="#b3401f" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah)"/><rect x="372.0" y="201.5" width="382.0" height="75.8" rx="8" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.3"/><circle cx="398" cy="221.54" r="11" fill="#b08d3e"/><text x="398.0" y="225.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text><text x="416.0" y="225.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Unlock the rock</text><text x="387.0" y="245.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">Phosphorus and iron are in the dirt but locked inside rock. The root</text><text x="387.0" y="259.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">pushes out acid, dissolves the rock, and takes them back in.</text><line x1="276.0" y1="266.0" x2="364.0" y2="239.4" stroke="#b08d3e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah)"/><rect x="372.0" y="293.3" width="382.0" height="75.8" rx="8" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.3"/><circle cx="398" cy="313.31" r="11" fill="#3e5a6b"/><text x="398.0" y="317.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text><text x="416.0" y="317.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Store the salt</text><text x="387.0" y="337.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">Splitting the chlorite makes salt. Pumps push that salt into storage</text><text x="387.0" y="351.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">sacs inside the plant's own cells, where it can do no harm.</text><line x1="276.0" y1="292.0" x2="364.0" y2="331.2" stroke="#3e5a6b" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah)"/><text x="196.0" y="399.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="italic">Water and light. That is the whole list of what it is given.</text>
</svg>
