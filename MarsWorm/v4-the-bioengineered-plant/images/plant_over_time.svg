#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">week 2</text><line x1="561.0" y1="397.0" x2="561.0" y2="407.0" stroke="#6b6b6b" stroke-width="1"/><text x="561.0" y="420.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">week 4</text><line x1="750.0" y1="397.0" x2="750.0" y2="407.0" stroke="#6b6b6b" stroke-width="1"/><text x="750.0" y="420.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">harvest</text><rect x="120.0" y="80.0" width="630.0" height="22.0" rx="11" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.2"/><text x="132.0" y="95.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">water and light, the whole way through</text><circle cx="120" cy="124" r="9" fill="#b3401f"/><text x="136.0" y="128.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">one seed, and nothing else</text><line x1="120.0" y1="266.0" x2="640.0" y2="266.0" stroke="#e2ddd9" stroke-width="1.4"/><polyline points="120.0,204.0 132.8,204.2 145.5,204.5 158.2,205.0 171.0,205.5 183.8,206.2 196.5,206.9 209.2,207.7 222.0,208.6 234.8,209.5 247.5,210.5 260.2,211.6 273.0,212.7 285.8,213.9 298.5,215.2 311.2,216.5 324.0,217.8 336.8,219.3 349.5,220.7 362.2,222.2 375.0,223.8 387.8,225.4 400.5,227.1 413.2,228.8 426.0,230.5 438.8,232.3 451.5,234.1 464.2,236.0 477.0,237.9 489.8,239.9 502.5,241.9 515.2,243.9 528.0,246.0 540.8,248.1 553.5,250.3 566.2,252.5 579.0,254.7 591.8,257.0 604.5,259.3 617.2,261.6 630.0,264.0" fill="none" stroke="#b3401f" stroke-width="2.2"/><text x="636.0" y="268.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#b3401f" text