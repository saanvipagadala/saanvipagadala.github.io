<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d">
<title id="t">One pot of Martian dirt, from seed to harvest</title>
<desc id="d">A timeline in three lanes running from sowing to harvest. The top lane shows what goes in, which is water and light the whole way and one seed at the start, and nothing else. The middle lane shows the dirt itself, which never moves and is never washed: the chlorate falls away to nothing, the phosphorus locked in rock comes free, and the salt is put away inside the plant. The bottom lane shows what comes out, which is nothing until the first harvest, and then food and the crop waste that makes ordinary soil for everything afterwards.</desc>
