e-width="1.3"/><text x="710.0" y="338.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">crop</text><text x="710.0" y="354.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">waste</text><text x="710.0" y="388.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">compost</text><text x="120.0" y="348.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">nothing at all until the first harvest,</text><text x="120.0" y="364.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">and then food and the makings of soil</text>
