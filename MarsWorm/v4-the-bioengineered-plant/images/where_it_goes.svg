<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 448" width="820" height="448" role="img" aria-labelledby="t d">
<title id="t">The split is the result</title>
<desc id="d">Three radishes side by side, one for each way experiment 4 could come out, with perchlorate measured in the leaf and in the root separately and drawn as two bars under each plant. A dashed line across all three marks how much is safe to eat. In the first, both bars are short and both parts stay clean, so root-only cleaning is enough and version 4 stands. In the second, the leaf bar is long and the root bar is short, which is fine for a radish and a warning for any leafy crop. In the third, the root bar is long, so the crop has to change and the perchlorate genes become essential. A radish root is the part people eat, and perchlorate blocks the thyroid, so a plant that grows well and stores it in its root is worse than no plant.</desc>
<rect x="0.0" y="0.0" width="820.0" height="448.0" rx="0" fill="#fdfcfb" stroke="none" stroke-width="1"/><text x="410.0" y="26.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">The split is the result</text><text x="410.0" y="44.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">Perchlorate is measured in the leaf and the root separately, and a radish root is the part you eat</text><text x="136.7" y="78.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Both parts stay clean</text><line x1="34.0" y1="168.0" x2="239.3" y2="168.0" stroke="#d9c3af" stroke-width="1.6"/><path d="M 136.66666666666666 168 Q 130.16666666666666 153.0 120.41666666666666 143.0" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="120.41666666666666" cy="143.0" rx="8.125" ry="5.25" fill="#4a6b3e" transform="rotate(-25 120.41666666666666 143.0)"/><path d="M 136.66666666666666 168 Q 143.16666666666666 153.75 152.91666666666666 144.25" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="152.91666666666666" cy="144.25" rx="8.125" ry="5.25" fill="#4a6b3e" transform="rotate(25 152.91666666666666 144.25)"/><path d="M 136.66666666666666 168 Q 133.66666666666666 147.75 129.16666666666666 134.25" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="129.16666666666666" cy="134.25" rx="8.125" ry="5.25" fill="#4a6b3e" transform="rotate(-25 129.16666666666666 134.25)"/><path d="M 136.66666666666666 168 Q 139.66666666666666 148.5 144.16666666666666 135.5" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-lin