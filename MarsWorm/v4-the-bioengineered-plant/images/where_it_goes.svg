fill="#b3401f"/><path d="M 683.3333333333333 199.25 q 2.5 12.5 -1.25 21.25" stroke="#b3401f" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 678.0833333333333 195.5 q -8.75 10.0 -14.0 16.25" stroke="#b3401f" fill="none" stroke-width="1.375" stroke-linecap="round" stroke-linejoin="round"/><path d="M 688.5833333333333 195.5 q 8.75 10.0 14.0 16.25" stroke="#b3401f" fill="none" stroke-width="1.375" stroke-linecap="round" stroke-linejoin="round"/><text x="600.7" y="245.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#4a4a4a" text-anchor="end" font-weight="normal" font-style="normal">leaf</text><rect x="608.7" y="236.0" width="132.0" height="12.0" rx="3" fill="#f0ecea" stroke="none" stroke-width="1"/><rect x="608.7" y="236.0" width="55.4" height="12.0" rx="3" fill="#4a6b3e" stroke="none" stroke-width="1"/><text x="600.7" y="275.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal">root</text><rect x="608.7" y="266.0" width="132.0" height="12.0" rx="3" fill="#f0ecea" stroke="none" stroke-width="1"/><rect x="608.7" y="266.0" width="121.4" height="12.0" rx="3" fill="#b3401f" stroke="none" stroke-width="1"/><line x1="681.3" y1="230.0" x2="681.3" y2="292.0" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 3"/><text x="683.3" y="326.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">The crop has to change, and</text><text x="683.3" y="338.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">the perchlorate genes become</text><text x="683.3" y="351.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-sty