s-serif" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">safe to eat, up to here</text><text x="136.7" y="326.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">Root-only cleaning is enough,</text><text x="136.7" y="338.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.4" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">and version 4 stands</text><line x1="273.3" y1="72.0" x2="273.3" y2="366.0" stroke="#e2ddd9" stroke-width="1"/><text x="410.0" y="78.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">The leaves load up</text><line x1="307.3" y1="168.0" x2="512.7" y2="168.0" stroke="#d9c3af" stroke-width="1.6"/><path d="M 410.0 168 Q 403.5 153.0 393.75 143.0" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="393.75" cy="143.0" rx="8.125" ry="5.25" fill="#4a6b3e" transform="rotate(-25 393.75 143.0)"/><path d="M 410.0 168 Q 416.5 153.75 426.25 144.25" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="426.25" cy="144.25" rx="8.125" ry="5.25" fill="#4a6b3e" transform="rotate(25 426.25 144.25)"/><path d="M 410.0 168 Q 407.0 147.75 402.5 134.25" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="402.5" cy="134.25" rx="8.125" ry="5.25" fill="#4a6b3e" transform="rotate(-25 402.5 134.25)"/><path d="M 410.0 168 Q 413.0 148.5 417.5 135.5" stroke="#4a6b3e" fill="none" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="417.5" cy="135.5" rx="8.125" ry="5.25" fill="#4a6b3e" transform="rotate(25 417.5 135.5)"/><path d="M 410.0 168 Q 410.0 145.5 410.0 130.5" stroke="#4a6b3e" fill="n