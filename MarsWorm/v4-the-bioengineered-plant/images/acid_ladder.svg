<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">How much acid does it take to free the phosphorus?</title>
<desc id="d">A graph with five rungs of citric acid strength along the bottom, from none up to ten millimolar, and phosphorus freed up the side. Two lines climb from left to right and then flatten out. The upper line is the tubes, which show what comes out of the rock. The lower line is the pots, which show what the plant actually takes up. A dashed line marks what the dirt gives up with no acid at all, and every rung is measured against it. A note points at the rung where the lines flatten, because that is how strong the trait needs to be, and past it the plant only wastes sugar. A second note says that if the ladder comes back flat, job 2 does not work and version 4 has to find phosphorus somewhere else.</desc>
<rect x="0.0" y="0.0" width="800.0" height="400.0" rx="0" fill="#fdfcfb" stroke="none" stroke-width="1"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs><text x="400.0" y="26.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">How much acid does it take to free the phosphorus?</text><text x="400.0" y="44.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">Five strengths, measured in tubes, then grown in pots</text><line x1="102.0" y1="292.0" x2="628.0" y2="292.0" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="102.0" y1="292.0" x2="102.0" y2="98.0" stroke="#6b6b6b" stroke-width="1.2"/><line x1="118.0" y1="292.0" x2="118.0" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="118.0" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="bold" font-style="normal">none</text><line x1="239.5" y1="292.0" x2="239.5" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="239.5" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">0.1 mM</text><line x1="361.0" y1="292.0" x2="361.0" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="361.0" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">0.5 mM</text><line x1="482.5" y1="292.0" x2="482.5" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="482.5" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">2 mM</text><line x1="604.0" y1="292.0" x2="604.0" y2="297.0" stroke="#6b6b6b" stroke-width="1"/><text x="604.0" y="311.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">10 mM</text><text x="361.0" y="332.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">citric acid in the water</text><text x="74" y="198.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a4a4a" text-anchor="middle" transform="rotate(-90 74 198.0)">phosphorus freed</text><line x1="102.0" y1="280.7" x2="614.0" y2="280.7" stroke="#6b6b6b" stroke-width="1.1" stroke-dasharray="4 4"/><text x="618.0" y="264.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">what the dirt gives up</text><text x="618.0" y="276.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">with no acid at all</text><polyline points="118.0,280.7 239.5,228.1 361.0,167.9 482.5,126.6 604.0,113.4" fill="none" stroke="#b3401f" stroke-width="2.6"/><circle cx="118.0" cy="280.7" r="4.2" fill="#b3401f"/><circle cx="239.5" cy="228.1" r="4.2" fill="#b3401f"/><circle cx="361.0" cy="167.9" r="4.2" fill="#b3401f"/><circle cx="482.5" cy="126.6" r="4.2" fill="#b3401f"/><circle cx="604.0" cy="113.4" r="4.2" fill="#b3401f"/><text x="618.0" y="99.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#b3401f" text-anchor="start" font-weight="bold" font-style="normal">the tubes</text><text x="618.0" y="112.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#b3401f" text-anchor="start" font-weight="normal" font-style="normal">what comes out of the rock</text><polyline points="118.0,282.6 239.5,243.1 361.0,194.2 482.5,167.9 604.0,164.2" fill="none" stroke="#4a6b3e" stroke-width="2.6"/><circle cx="118.0" cy="282.6" r="4.2" fill="#4a6b3e"/><circle cx="239.5" cy="243.1" r="4.2" fill="#4a6b3e"/><circle cx="361.0" cy="194.2" r="4.2" fill="#4a6b3e"/><circle cx="482.5" cy="167.9" r="4.2" fill="#4a6b3e"/><circle cx="604.0" cy="164.2" r="4.2" fill="#4a6b3e"/><text x="618.0" y="170.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#4a6b3e" text-anchor="start" font-weight="bold" font-style="normal">the pots</text><text x="618.0" y="183.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#4a6b3e" text-anchor="start" font-weight="normal" font-style="normal">what the plant takes up</text><rect x="114.0" y="108.0" width="214.0" height="52.0" rx="7" fill="#fdfcfb" stroke="#b08d3e" stroke-width="1.3"/><text x="125.0" y="125.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#b08d3e" text-anchor="start" font-weight="bold" font-style="normal">The rung where it flattens</text><text x="125.0" y="139.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">is how strong the trait needs to be.</text><text x="125.0" y="152.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">Past it, the plant wastes sugar</text><line x1="328.0" y1="134.0" x2="474.5" y2="118.6" stroke="#b08d3e" stroke-width="1.2" marker-end="url(#ah)"/><rect x="40.0" y="342.0" width="720.0" height="42.0" rx="7" fill="#faf1ec" stroke="none" stroke-width="1"/><text x="400.0" y="360.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#8a3317" text-anchor="middle" font-weight="bold" font-style="normal">If the ladder comes back flat, job 2 does not work</text><text x="400.0" y="373.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">and version 4 has to find phosphorus somewhere else</text>
</svg>
