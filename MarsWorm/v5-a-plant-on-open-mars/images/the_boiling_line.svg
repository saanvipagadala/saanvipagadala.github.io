<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Where a leaf's water starts to boil</title>
<desc id="d">A graph of the water vapour pressure inside a leaf against the leaf's temperature, drawn as a rising curve. A horizontal line marks Martian air pressure at 6.1 millibars. The curve crosses it at 0 degrees Celsius, so any leaf warmer than freezing on open Mars holds water at a higher pressure than the whole atmosphere outside, and it boils. A second line marks the thicker air at the bottom of Hellas basin, 11.5 millibars, which the curve crosses at 9 degrees. On Earth the same curve does not meet the air pressure line until 99 degrees.</desc>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="0" fill="#fdfcfb" stroke="none" stroke-width="1"/><text x="380.0" y="26.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Where a leaf's water starts to boil</text><text x="380.0" y="44.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">The air inside a leaf is saturated. If that vapour beats the air outside, the water boils.</text><line x1="112.0" y1="340.0" x2="610.0" y2="340.0" stroke="#6b6b6b" stroke-width="1.3"/><line x1="112.0" y1="340.0" x2="112.0" y2="80.0" stroke="#6b6b6b" stroke-width="1.3"/><line x1="112.0" y1="340.0" x2="112.0" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="112.0" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">-40</text><line x1="183.1" y1="340.0" x2="183.1" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="183.1" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">-30</text><line x1="254.3" y1="340.0" x2="254.3" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="254.3" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">-20</text><line x1="325.4" y1="340.0" x2="325.4" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="325.4" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">-10</text><line x1="396.6" y1="340.0" x2="396.6" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="396.6" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">0</text><line x1="467.7" y1="340.0" x2="467.7" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="467.7" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">10</text><line x1="538.9" y1="340.0" x2="538.9" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="538.9" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">20</text><line x1="610.0" y1="340.0" x2="610.0" y2="345.0" stroke="#6b6b6b" stroke-width="1"/><text x="610.0" y="359.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">30</text><text x="361.0" y="378.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">leaf temperature, degrees C</text><line x1="107.0" y1="340.0" x2="112.0" y2="340.0" stroke="#6b6b6b" stroke-width="1"/><text x="103.0" y="343.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-style="normal">0.1</text><line x1="107.0" y1="246.4" x2="112.0" y2="246.4" stroke="#6b6b6b" stroke-width="1"/><text x="103.0" y="249.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-style="normal">1</text><line x1="107.0" y1="172.9" x2="112.0" y2="172.9" stroke="#6b6b6b" stroke-width="1"/><text x="103.0" y="176.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-style="normal">6.1</text><li