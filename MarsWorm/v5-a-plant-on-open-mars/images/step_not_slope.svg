<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" width="800" height="408" role="img" aria-labelledby="t d">
<title id="t">A step, not a slope</title>
<desc id="d">A graph of how much water a leaf loses per minute against how cold it is held, at six millibars, across five temperatures from minus twenty to plus twenty. The gap between minus two and plus five is shaded and labelled the gap that matters. One line shows what boiling looks like, which is our claim: it stays low and flat through the cold temperatures and then jumps sharply across that gap. A dashed line shows what ordinary evaporation would look like instead, rising smoothly the whole way, which would mean our claim is wrong. A third line shows the same leaves at ordinary pressure, staying low throughout.</desc>
<rect x="0.0" y="0.0" width="800.0" height="408.0" rx="0" fill="#fdfcfb" stroke="none" stroke-width="1"/><text x="400.0" y="26.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">A step, not a slope</text><text x="400.0" y="44.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">Leaves held at six millibars. Only the shape of the line answers the question.</text><rect x="341.0" y="70.0" width="112.5" height="216.0" rx="0" fill="#faf1ec" stroke="none" stroke-width="1"/><text x="397.2" y="84.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.8" fill="#8a3317" text-anchor="middle" font-weight="bold" font-style="normal">THE GAP THAT MATTERS</text><line x1="100.0" y1="286.0" x2="588.0" y2="286.0" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="100.0" y1="286.0" x2="100.0" y2="90.0" stroke="#6b6b6b" stroke-width="1.2"/><line x1="116.0" y1="286.0" x2="116.0" y2="291.0" stroke="#6b6b6b" stroke-width="1"/><text x="116.0" y="305.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">-20 °C</text><line x1="228.5" y1="286.0" x2="228.5" y2="291.0" stroke="#6b6b6b" stroke-width="1"/><text x="228.5" y="305.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">-10 °C</text><line x1="341.0" y1="286.0" x2="341.0" y2="291.0" stroke="#6b6b6b" stroke-width="1"/><text x="341.0" y="305.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">-2 °C</text><line x1="453.5" y1="286.0" x2="453.5" y2="291.0" stroke="#6b6b6b" stroke-width="1"/><text x="453.5" y="305.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">+5 °C</text><line x1="566.0" y1="286.0" x2="566.0" y2="291.0" stroke="#6b6b6b" stroke-width="1"/><text x="566.0" y="305.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">+20 °C</text><text x="341.0" y="326.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">how cold the leaf is held</text><text x="70" y="191.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a4a4a" text-anchor="middle" transform="rotate(-90 70 191.0)">water lost per minute</text><polyline points="116.0,272.7 228.5,240.4 341.0,210.0 453.5,175.8 566.0,134.0" fill="none" stroke="#6b6b6b" stroke-width="2.0" stroke-dasharray="5 4"/><polyline points="116.0,278.4 228.5,272.7 341.0,267.0 453.5,259.4 566.0,246.1" fill="none" stroke="#3e5a6b" stroke-width="2.0"/><circle cx="116.0" cy="278.4" r="4" fill="#3e5a6b"/><circle cx="228.5" cy="272.7" r="4" fill="#3e5a6b"/><circle cx="341.0" cy="267.0" r="4" fill="#3e5a6b"/><circle cx="453.5" cy="259.4" r="4" fill="#3e5a6b"/><circle cx="566.0" cy="246.1" r="4" fill="#3e5a6b"/><polyline points="116.0,272.7 228.5,263.2 341.0,249.9 453.5,137.8 566.0,107.4" fill="none" stroke="#b3401f" stroke-width="2.6"/><circle cx="116.0" cy="272.7" r="4" fill="#b3401f"/><circle cx="228.5" cy="263.2" r="4" fill="#b3401f"/><circle cx="341.0" cy="249.9" r="4" fill="#b3401f"/><circle cx="453.5" cy="137.8" r="4" fill="#b3401f"/><circle cx="566.0" cy="107.4" r="4" fill="#b3401f"/><text x="580.0" y="111.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#b3401f" text-anchor="start" font-weight="bold" font-style="normal">what boiling looks like</text><text x="580.0" y="124.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#b3401f" text-anchor="start" font-weight="normal" font-style="normal">our claim</text><text x="580.0" y="138.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">what evaporation</text><text x="580.0" y="151.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">looks like</text><text x="580.0" y="164.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">our claim is wrong</text><text x="580.0" y="250.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#3e5a6b" text-anchor="start" font-weight="bold" font-style="normal">the same leaves at</text><text x="580.0" y="263.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#3e5a6b" text-anchor="start" font-weight="bold" font-style="normal">ordinary pressure</text><rect x="40.0" y="338.0" width="720.0" height="42.0" rx="7" fill="#f7f3f1" stroke="none" stroke-width="1"/><text x="400.0" y="356.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#4a4a4a" text-anchor="middle" font-weight="normal" font-style="normal">A smooth rise is ordinary evaporation, and our claim adds nothing.</text><text x="400.0" y="369.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" fill="#8a3317" text-anchor="middle" font-weight="bold" font-style="normal">A jump across that gap is water boiling inside the leaf.</text>
</svg>
