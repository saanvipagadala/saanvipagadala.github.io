<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 485" width="800" height="485" role="img" aria-labelledby="t d">
<title id="t">One plant on open Mars, and the four things the surface takes away</title>
<desc id="d">A low, dark plant growing on open Martian ground, with nothing built around it. Three layers are named down the left side: Martian air, six millibars of it, then Martian dirt with chlorate and salt in it, then buried ice one to two metres down. The plant's roots reach that ice. Four numbered notes point at the plant. Job one is keeping the water in, because above freezing a leaf's water is at higher pressure than the whole Martian atmosphere and boils, so the plant must stay cold and nearly sealed. Job two is surviving the night, which reaches minus eighty, by drying out completely rather than by antifreeze. Job three is blocking ultraviolet light with screening pigments the plant already makes. Job four is reaching the water, one to two metres down, and drinking the salty water at the edge of buried ice.</desc>
<rect x="0.0" y="0.0" width="800.0" height="520.0" rx="0" fill="#fdfcfb" stroke="none" stroke-width="1"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs><text x="400.0" y="26.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">One plant on open Mars, and the four things the surface takes away</text><text x="400.0" y="44.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="normal">No dome, no sheet, no digging. Nothing is built around it.</text><rect x="30.0" y="62.0" width="300.0" height="173.0" rx="5" fill="#f3e7dd" stroke="none" stroke-width="1"/><rect x="30.0" y="235.0" width="300.0" height="230.0" rx="5" fill="#e8d9cc" stroke="none" stroke-width="1"/><circle cx="166.5" cy="357.2" r="1.4" fill="#d9c3af"/><circle cx="300.5" cy="338.0" r="1.4" fill="#d9c3af"/><circle cx="182.2" cy="362.8" r="1.4" fill="#d9c3af"/><circle cx="90.4" cy="347.4" r="1.4" fill="#d9c3af"/><circle cx="216.9" cy="404.8" r="1.4" fill="#d9c3af"/><circle cx="64.7" cy="304.9" r="1.4" fill="#d9c3af"/><circle cx="63.8" cy="408.2" r="1.4" fill="#d9c3af"/><circle cx="234.9" cy="251.5" r="1.4" fill="#d9c3af"/><circle cx="316.9" cy="439.8" r="1.4" fill="#d9c3af"/><circle cx="223.7" cy="368.6" r="1.4" fill="#d9c3af"/><circle cx="82.7" cy="246.1" r="1.4" fill="#d9c3af"/><circle cx="188.1" cy="255.1" r="1.4" fill="#d9c3af"/><circle cx="92.0" cy="292.4" r="1.4" fill="#d9c3af"/><circle cx="46.5" cy="337.6" r="1.4" fill="#d9c3af"/><circle cx="163.1" cy="414.9" r="1.4" fill="#d9c3af"/><circle cx="185.4" cy="373.6" r="1.4" fill="#d9c3af"/><circle cx="179.9" cy="378.1" r="1.4" fill="#d9c3af"/><circle cx="167.9" cy="299.7" r="1.4" fill="#d9c3af"/><circle cx="321.3" cy="446.1" r="1.4" fill="#d9c3af"/><circle cx="276.6" cy="387.4" r="1.4" fill="#d9c3af"/><circle cx="127.5" cy="289.9" r="1.4" fill="#d9c3af"/><circle cx="120.1" cy="257.3" r="1.4" fill="#d9c3af"/><circle cx="255.6" cy="324.7" r="1.4" fill="#d9c3af"/><circle cx="278.4" cy="321.8" r="1.4" fill="#d9c3af"/><circle cx="310.1" cy="415.9" r="1.4" fill="#d9c3af"/><circle cx="38.2" cy="285.8" r="1.4" fill="#d9c3af"/><circle cx="296.5" cy="338.9" r="1.4" fill="#d9c3af"/><circle cx="316.4" cy="324.1" r="1.4" fill="#d9c3af"/><circle cx="58.7" cy="371.4" r="1.4" fill="#d9c3af"/><circle cx="259.1" cy="298.0" r="1.4" fill="#d9c3af"/><circle cx="62.7" cy="310.8" r="1.4" fill="#d9c3af"/><circle cx="311.8" cy="397.6" r="1.4" fill="#d9c3af"/><circle cx="71.5" cy="293.3" r="1.4" fill="#d9c3af"/><circle cx="66.7" cy="255.2" r="1.4" fill="#d9c3af"/><circle cx="264.4" cy="279.2" r="1.4" fill="#d9c3af"/><circle cx="196.8" cy="334.3" r="1.4" fill="#d9c3af"/><circle cx="92.2" cy="392.3" r="1.4" fill="#d9c3af"/><circle cx="75.2" cy="374.3" r="1.4" fill="#d9c3af"/><circle cx="71.1" cy="328.8" r="1.4" fill="#d9c3af"/><circle cx="98.5" cy="298.0" r="1.4" fill="#d9c3af"/><circle cx="313.7" cy="406.9" r="1.4" fill="#d9c3af"/><circle cx="124.4" cy="423.5" r="1.4" fill="#d9c3af"/><circle cx="97.8" cy="323.4" r="1.4" fill="#d9c3af"/><circle cx="280.6" cy="373.9" r="1.4" fill="#d9c3af"/><circle cx="66.5" cy="444.8" r="1.4" fill="#d9c3af"/><circle cx="98.6" cy="295.7" r="1.4" fill="#d9c3af"/><circle cx="257.4" cy="310.1" r="1.4" fill="#d9c3af"/><circle cx="122.2" cy="258.0" r="1.4" fill="#d9c3af"/><circle cx="63.6" cy="361.9" r="1.4" fill="#d9c3af"/><circle cx="107.0" cy="365.7" r="1.4" fill="#d9c3af"/><circle cx="143.6" cy="335.5" r="1.4" fill="#d9c3af"/><circle cx="310.4" cy="341.7" r="1.4" fill="#d9c3af"/><circle cx="201.2" cy="419.8" r="1.4" fill="#d9c3af"/><circle cx="89.9" cy="274.4" r="1.4" fill="#d9c3af"/><circle cx="296.0" cy="409.8" r="1.4" fill="#d9c3af"/><circle cx="108.9" cy="281.7" r="1.4" fill="#d9c3af"/><circle cx="248.0" cy="434.8" r="1.4" fill="#d9c3af"/><circle cx="93.8" cy="436.8" r="1.4" fill="#d9c3af"/><circle cx="288.5" cy="366.1" r="1.4" fill="#d9c3af"/><circle cx="157.7" cy="264.2" r="1.4" fill="#d9c3af"/><circle cx="49.0" cy="439.4" r="1.4" fill="#d9c3af"/><circle cx="105.7" cy="386.7" r="1.4" fill="#d9c3af"/><circle cx="111.0" cy="411.0" r="1.4" fill="#d9c3af"/><circle cx="207.4" cy="302.9" r="1.4" fill="#d9c3af"/><circle cx="87.8" cy="390.0" r="1.4" fill="#d9c3af"/><circle cx="57.5" cy="289.6" r="1.4" fill="#d9c3af"/><circle cx="196.9" cy="416.9" r="1.4" fill="#d9c3af"/><circle cx="212.5" cy="300.2" r="1.4" fill="#d9c3af"/><circle cx="298.5" cy="284.6" r="1.4" fill="#d9c3af"/><circle cx="42.7" cy="297.9" r="1.4" fill="#d9c3af"/><circle cx="164.6" cy="255.3" r="1.4" fill="#d9c3af"/><circle cx="88.1" cy="318.2" r="1.4" fill="#d9c3af"/><circle cx="200.5" cy="269.8" r="1.4" fill="#d9c3af"/><circle cx="140.8" cy="424.8" r="1.4" fill="#d9c3af"/><circle cx="316.5" cy="377.0" r="1.4" fill="#d9c3af"/><circle cx="234.3" cy="362.2" r="1.4" fill="#d9c3af"/><circle cx="77.9" cy="250.2" r="1.4" fill="#d9c3af"/><circle cx="43.1" cy="428.7" r="1.4" fill="#d9c3af"/><circle cx="237.1" cy="439.4" r="1.4" fill="#d9c3af"/><circle cx="44.0" cy="372.8" r="1.4" fill="#d9c3af"/><circle cx="175.0" cy="392.0" r="1.4" fill="#d9c3af"/><circle cx="128.6" cy="446.9" r="1.4" fill="#d9c3af"/><circle cx="59.4" cy="354.4" r="1.4" fill="#d9c3af"/><circle cx="247.3" cy="426.6" r="1.4" fill="#d9c3af"/><circle cx="247.3" cy="386.6" r="1.4" fill="#d9c3af"/><circle cx="263.3" cy="429.7" r="1.4" fill="#d9c3af"/><circle cx="137.9" cy="382.8" r="1.4" fill="#d9c3af"/><circle cx="293.8" cy="420.7" r="1.4" fill="#d9c3af"/><rect x="30.0" y="400.0" width="300.0" height="65.0" rx="5" fill="#cfe0e6" stroke="none" stroke-width="1"/><line x1="30.0" y1="235.0" x2="330.0" y2="235.0" stroke="#d9c3af" stroke-width="2"/><text x="44.0" y="209.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">MARTIAN AIR</text><text x="44.0" y="222.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">6 millibars of it</text><text x="44.0" y="374.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6b6b6b" text-anchor="start" font-weight="bold" font-style="normal">MARTIAN DIRT</text><text x="44.0" y="387.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-style="normal">chlorate and salt in it</text><text x="44.0" y="439.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.2" fill="#3e5a6b" text-anchor="start" font-weight="bold" font-style="normal">BURIED ICE</text><text x="44.0" y="452.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.8" fill="#3e5a6b" text-anchor="start" font-weight="normal" font-style="normal">one to two metres down</text><path d="M 180 235 Q 168.0 225.2 150 221" stroke="#3f4a33" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="221" rx="13" ry="6" fill="#3f4a33" transform="rotate(-18 150 221)"/><path d="M 180 235 Q 192.0 225.9 210 222" stroke="#3f4a33" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="210" cy="222" rx="13" ry="6" fill="#3f4a33" transform="rotate(18 210 222)"/><path d="M 180 235 Q 174.4 221.0 166 215" stroke="#3f4a33" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="166" cy="215" rx="13" ry="6" fill="#3f4a33" transform="rotate(-18 166 215)"/><path d="M 180 235 Q 185.6 221.7 194 216" stroke="#3f4a33" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="194" cy="216" rx="13" ry="6" fill="#3f4a33" transform="rotate(18 194 216)"/><path d="M 180 235 Q 180.0 219.6 180 213" stroke="#3f4a33" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="180" cy="213" rx="13" ry="6" fill="#3f4a33" transform="rotate(18 180 213)"/><path d="M 180 235 L 180 431" stroke="#6b5a45" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 180 265 Q 177.8 337.0 177.4 405" stroke="#6b5a45" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 180 265 Q 149.2 307.0 143.6 355" stroke="#6b5a45" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 180 265 Q 208.6 314.2 213.8 367" stroke="#6b5a45" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="180.0" y="195.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-style="italic">low, dark and cold</text><rect x="360.0" y="76.0" width="415.0" height="89.5" rx="8" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.3"/><circle cx="386" cy="96" r="11" fill="#b3401f"/><text x="386.0" y="100.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text><text x="404.0" y="100.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Keep the water in</text><text x="375.0" y="120.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">Above freezing a leaf's water is at higher pressure than the whole Martian</text><text x="375.0" y="133.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">atmosphere, so it boils. The plant must stay cold and nearly sealed whenever</text><text x="375.0" y="147.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">it is open to the air.</text><rect x="360.0" y="179.5" width="415.0" height="75.8" rx="8" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.3"/><circle cx="386" cy="199.54" r="11" fill="#4a4a4a"/><text x="386.0" y="203.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text><text x="404.0" y="203.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Survive the night</text><text x="375.0" y="223.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">Nights reach minus eighty. Antifreeze buys five degrees at most, so the</text><text x="375.0" y="237.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">plant dries out completely instead and restarts in the morning.</text><rect x="360.0" y="269.3" width="415.0" height="75.8" rx="8" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.3"/><circle cx="386" cy="289.31" r="11" fill="#b08d3e"/><text x="386.0" y="293.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text><text x="404.0" y="293.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Block the light that harms</text><text x="375.0" y="313.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">Mars has no ozone, so ultraviolet reaches the ground. Screening pigments in</text><text x="375.0" y="327.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">the outer leaf stop it, and plants already make them.</text><rect x="360.0" y="359.1" width="415.0" height="75.8" rx="8" fill="#fdfcfb" stroke="#e2ddd9" stroke-width="1.3"/><circle cx="386" cy="379.08" r="11" fill="#3e5a6b"/><text x="386.0" y="383.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text><text x="404.0" y="383.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Reach the water</text><text x="375.0" y="403.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">No rain and no rivers. Roots go down one to two metres to buried ice, and</text><text x="375.0" y="416.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" fill="#4a4a4a" text-anchor="start" font-weight="normal" font-style="normal">drink the salty water at its edge.</text><line x1="300.0" y1="202.0" x2="352.0" y2="120.8" stroke="#b3401f" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah)"/><line x1="300.0" y1="216.0" x2="352.0" y2="217.4" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah)"/><line x1="300.0" y1="230.0" x2="352.0" y2="307.2" stroke="#b08d3e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah)"/><line x1="300.0" y1="385.0" x2="352.0" y2="397.0" stroke="#3e5a6b" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah)"/>
</svg>
